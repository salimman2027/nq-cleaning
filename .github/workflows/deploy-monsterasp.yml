name: Deploy to MonsterASP (FTP from GitHub)

# Builds the site and uploads it to MonsterASP over FTP/FTPS from GitHub's servers.
# Secrets needed: FTP_SERVER (e.g. site111676.siteasp.net), FTP_USER, FTP_PASSWORD.
# web.config holds your database password and JWT secret, so it is NEVER overwritten by a normal deploy.
# Run once with "upload_web_config" = true to place the template, then edit it on the server.
on:
  workflow_dispatch:
    inputs:
      protocol:
        description: "ftps (encrypted, recommended) or ftp"
        default: ftps
        type: choice
        options: [ftps, ftp]
      upload_web_config:
        description: "First deploy only: upload the web.config template"
        default: false
        type: boolean
      server_dir:
        description: "Remote folder"
        default: /wwwroot/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=""
          for v in FTP_SERVER FTP_USER FTP_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Missing GitHub secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run build
      - name: Assemble site folder
        run: |
          mkdir -p stage/dist stage/frontend cfg
          cp -r backend/dist/. stage/dist/
          cp -r frontend/dist/. stage/frontend/
          cp deploy/monsterasp/server.js stage/
          cp deploy/monsterasp/web.config cfg/
          node -e "const p=require('./backend/package.json');require('fs').writeFileSync('stage/package.json',JSON.stringify({name:'nq-cleaning',version:p.version,private:true,main:'server.js',dependencies:p.dependencies},null,2))"
          (cd stage && npm install --omit=dev --no-audit --no-fund)
          node -e "require('./stage/node_modules/express');require('./stage/node_modules/mssql');require('./stage/node_modules/bcryptjs');console.log('runtime deps resolve')"
      - name: Upload web.config template (first deploy only)
        if: ${{ inputs.upload_web_config }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ inputs.protocol }}
          local-dir: cfg/
          server-dir: ${{ inputs.server_dir }}
          state-name: .ftp-state-config.json
      - name: Upload site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ inputs.protocol }}
          local-dir: stage/
          server-dir: ${{ inputs.server_dir }}
          state-name: .ftp-state-site.json
          exclude: |
            **/.git*
            **/.git*/**
            web.config
            logs/**
