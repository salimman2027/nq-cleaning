name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/android-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Install dependencies
        run: npm install --workspace frontend --include-workspace-root=false

      - name: Build web app
        working-directory: frontend
        env:
          # Public HTTPS URL of the backend, e.g. https://api.example.com/api
          # Set it in GitHub: Settings > Secrets and variables > Actions > Variables > API_URL
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then echo "::warning::API_URL variable is not set; the APK will call /api on its own origin and cannot reach a server."; fi
          npm run build

      - name: Add and sync Android project
        working-directory: frontend
        run: |
          npx cap add android
          npx cap sync android

      - name: Assemble debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: nq-cleaning-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
