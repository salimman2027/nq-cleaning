name: Reset platform admin password

# Forgot the admin password? 1) In Settings > Secrets > Actions set ADMIN_PASSWORD to a NEW password (12+ chars)
# and make sure ADMIN_EMAIL is the admin e-mail. 2) Run this workflow. The password never appears in the logs.
on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      DB_SERVER: ${{ secrets.DB_SERVER }}
      DB_PORT: "1433"
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_ENCRYPT: "true"
      DB_TRUST_SERVER_CERT: "true"
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --workspace backend --include-workspace-root=false
      - run: npm run reset:admin -w backend
